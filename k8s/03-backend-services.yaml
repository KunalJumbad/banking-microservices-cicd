apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication-service
  template:
    metadata:
      labels:
        app: authentication-service
    spec:
      containers:
        - name: authentication-service
          image: banking-authentication-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: banking-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
          ports:
            - containerPort: 9898
---
apiVersion: v1
kind: Service
metadata:
  name: authentication-service
spec:
  type: NodePort
  ports:
    - port: 9898
      targetPort: 9898
      nodePort: 30898
  selector:
    app: authentication-service
---
