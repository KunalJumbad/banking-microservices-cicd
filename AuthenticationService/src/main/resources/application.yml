spring:
  application:
    name: AuthenticationService
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/csb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 9898

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

app:
  jwt:
    secret: ${JWT_SECRET:project2-local-jwt-signing-key-change-before-any-production-use}
    expiration-ms: 1800000
